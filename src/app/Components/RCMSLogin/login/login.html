<div class="login-card">

    <h2 class="mb-2">Welcome Back</h2>
    <p class="text-muted mb-4">Sign in to Room Cost Management System</p>

    <form (ngSubmit)="onLogin()">

        <div class="mb-3">
            <label class="form-label">Username</label>
            <input
                type="text"
                class="form-control"
                placeholder="Enter username"
                [(ngModel)]="username"
                name="username">
        </div>

        <div class="mb-4">
            <label class="form-label">Password</label>
            <input
                type="password"
                class="form-control"
                placeholder="Enter password"
                [(ngModel)]="password"
                name="password">
        </div>

        <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">
            <i class="bi bi-box-arrow-in-right me-1"></i> Login to Portal
        </button>

        <div class="text-center mt-3">
            <a routerLink="/portal/dashboard" class="forgot-link text-primary fw-semibold">
                Explore Demo Portal &rarr;
            </a>
        </div>
        <div class="text-center mt-2">
            <a routerLink="/RCMSRegistrations" class="forgot-link text-muted">
                Create Account
            </a>
        </div>

    </form>

</div>
