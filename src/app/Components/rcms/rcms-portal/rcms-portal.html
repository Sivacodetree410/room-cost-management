<div class="rcms-app-layout" [class.sidebar-collapsed]="isSidebarCollapsed">
  <!-- Sidebar Navigation -->
  <aside class="rcms-sidebar no-print">
    <!-- Brand Header -->
    <div class="sidebar-header d-flex align-items-center justify-content-between p-3 border-bottom">
      <div class="d-flex align-items-center gap-2 overflow-hidden" routerLink="/portal/dashboard" style="cursor: pointer;">
        <div class="brand-badge bg-primary text-white rounded-3 d-flex align-items-center justify-content-center">
          <i class="bi bi-houses-fill fs-5"></i>
        </div>
        <div class="brand-title fw-bold text-main" *ngIf="!isSidebarCollapsed">
          <span class="text-primary">Bachelor</span> Room
          <div class="small text-muted font-normal" style="font-size: 0.72rem; font-weight: 500;">Roommate Cost Split</div>
        </div>
      </div>
      <button class="btn btn-sm btn-link text-muted p-0" (click)="toggleSidebar()" title="Toggle Sidebar">
        <i class="bi" [ngClass]="isSidebarCollapsed ? 'bi-chevron-right' : 'bi-chevron-left'"></i>
      </button>
    </div>

    <!-- Navigation Links -->
    <div class="sidebar-nav py-3">
      <ul class="nav flex-column gap-1 px-2">
        <li class="nav-item" *ngFor="let item of navItems">
          <a
            class="nav-link d-flex align-items-center justify-content-between rounded-3 py-2 px-3"
            [routerLink]="item.route"
            routerLinkActive="active"
            [routerLinkActiveOptions]="{ exact: item.exact || false }"
            [title]="item.label"
          >
            <div class="d-flex align-items-center gap-3">
              <i class="bi" [ngClass]="item.icon"></i>
              <span class="nav-label" *ngIf="!isSidebarCollapsed">{{ item.label }}</span>
            </div>
            <span *ngIf="!isSidebarCollapsed && item.badge" class="badge bg-primary-subtle text-primary small">
              {{ item.badge }}
            </span>
          </a>
        </li>
      </ul>
    </div>

    <!-- Sidebar Footer Bachelor Profile -->
    <div class="sidebar-footer p-3 border-top mt-auto" *ngIf="!isSidebarCollapsed">
      <div class="d-flex align-items-center justify-content-between">
        <div class="d-flex align-items-center gap-2">
          <div class="avatar bg-primary text-white rounded-circle d-flex align-items-center justify-content-center fw-bold" style="width: 36px; height: 36px;">
            S
          </div>
          <div>
            <div class="small fw-bold text-main">Siva (Lead Roommate)</div>
            <div class="text-muted" style="font-size: 0.75rem;">Room 101 Admin</div>
          </div>
        </div>
        <button class="btn btn-sm btn-outline-danger p-1" (click)="logout()" title="Logout">
          <i class="bi bi-box-arrow-right"></i>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content Wrapper -->
  <div class="rcms-main-wrapper d-flex flex-column min-vh-100">
    <!-- Topbar Navigation -->
    <header class="rcms-header bg-card border-bottom sticky-top no-print">
      <div class="d-flex align-items-center justify-content-between px-3 px-lg-4 py-2">
        <div class="d-flex align-items-center gap-3">
          <button class="btn btn-sm btn-outline-secondary d-lg-none" (click)="toggleSidebar()">
            <i class="bi bi-list fs-5"></i>
          </button>
          <div class="active-location-badge d-flex align-items-center gap-2">
            <span class="badge bg-primary-subtle text-primary border border-primary-subtle px-2 py-1">
              <i class="bi bi-house-door-fill me-1"></i> Bachelor Boys Sharing
            </span>
            <span class="small text-muted d-none d-sm-inline">
              Selected Room: <strong>Room 101</strong> &bull; Period: <strong>June 2026</strong>
            </span>
          </div>
        </div>

        <!-- Topbar Right Actions -->
        <div class="d-flex align-items-center gap-2">
          <!-- Dark / Light Mode Switch -->
          <button
            class="btn btn-sm btn-outline-secondary rounded-circle d-flex align-items-center justify-content-center"
            style="width: 36px; height: 36px;"
            (click)="toggleTheme()"
            [title]="isDarkMode ? 'Switch to Light Mode' : 'Switch to Dark Mode'"
          >
            <i class="bi" [ngClass]="isDarkMode ? 'bi-sun-fill text-warning' : 'bi-moon-stars-fill text-primary'"></i>
          </button>

          <!-- Quick Navigation to Login -->
          <button class="btn btn-sm btn-outline-primary" (click)="logout()">
            <i class="bi bi-box-arrow-right me-1"></i> Switch Account
          </button>
        </div>
      </div>
    </header>

    <!-- Main Dynamic Router Outlet -->
    <main class="rcms-content-body flex-grow-1 p-3 p-lg-4">
      <router-outlet></router-outlet>
    </main>

    <!-- Footer -->
    <footer class="rcms-footer border-top py-3 text-center text-muted small no-print">
      Bachelor Room Cost Management System &bull; Dynamic Prorated Room Rent & Bill Split for Bachelor Boys &copy; {{ currentYear }}
    </footer>
  </div>
</div>
